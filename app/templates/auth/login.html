{% extends "base.html" %}
{% block title %}Вход — {{ app_name }}{% endblock %}
{% block content %}
<h1>Вход</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/auth/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row">
    <label>Имя пользователя или email</label>
    <input type="text" name="login" value="{{ login or '' }}" required autofocus>
  </div>
  <div class="row">
    <label>Пароль</label>
    <input type="password" name="password" required>
  </div>
  <div class="actions"><button class="btn" type="submit">Войти</button></div>
</form>
{% endblock %}
