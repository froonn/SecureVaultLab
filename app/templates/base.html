<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1rem auto; padding: 0 1rem; color: #222; }
  nav { display: flex; gap: 1rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid #ddd; margin-bottom: 1rem; }
  nav a { color: #0a58ca; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  .spacer { flex: 1; }
  .btn { display: inline-block; padding: .4rem .8rem; border: 1px solid #888; border-radius: 4px; background: #f5f5f5; cursor: pointer; text-decoration: none; color: #222; }
  .btn:hover { background: #eaeaea; }
  .btn-danger { background: #f8d7da; border-color: #dc3545; color: #842029; }
  .error { background: #f8d7da; border: 1px solid #dc3545; padding: .5rem .8rem; border-radius: 4px; margin: .5rem 0; color: #842029; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin: .5rem 0; }
  .card h3 { margin-top: 0; }
  .muted { color: #666; font-size: .85rem; }
  form .row { margin: .5rem 0; display: flex; flex-direction: column; }
  form label { font-weight: 600; margin-bottom: .2rem; }
  form input[type=text], form input[type=password], form input[type=email], form textarea { padding: .4rem; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
  form textarea { min-height: 8rem; resize: vertical; }
  .actions { display: flex; gap: .5rem; align-items: center; }
</style>
</head>
<body>
<nav>
  <a href="/">Главная</a>
  <a href="/public">Публичные</a>
  {% if user %}
    <a href="/confidential">Конфиденциальные</a>
    {% if user.role == 'admin' %}<a href="/admin/users">Админка</a>{% endif %}
  {% endif %}
  <span class="spacer"></span>
  {% if user %}
    <span class="muted">{{ user.username }} ({{ user.role }})</span>
    <form method="post" action="/auth/logout" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn" type="submit">Выйти</button>
    </form>
  {% else %}
    <a href="/auth/login">Войти</a>
    <a href="/auth/register">Регистрация</a>
  {% endif %}
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
