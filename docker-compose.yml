services:
  app:
    build: .
    container_name: lab21_app
    restart: unless-stopped
    secrets:
      - fernet_key                     # ← оставляем только это
    env_file:
      - .env
    volumes:
      - ./data:/data
      # - ./secrets/fernet_key:/run/secrets/fernet_key:ro   ← УДАЛИТЬ
    networks:
      - app_net
    # наружу порт не публикуем — только через nginx
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false            # /data нужен на запись; можно ужать через tmpfs, если захотим
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: lab21_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params_inline.conf:/etc/nginx/proxy_params_inline.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx  # <--- Добавьте эту строку для сохранения логов на хост
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true

networks:
  app_net:
    driver: bridge

secrets:
  fernet_key:
    file: ./secrets/fernet_key