worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Docker embedded DNS — резолвим имена контейнеров в рантайме
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # rate limiting
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/s;

    # адрес апстрима в переменной — заставляем nginx резолвить его при каждом запросе
    map $host $app_upstream {
        default "http://app:8000";
    }

    # Определяем, был ли запрос от ngrok (он шлёт X-Forwarded-Proto: https)
    # Если заголовок есть — доверяем ему, иначе используем $scheme.
    map $http_x_forwarded_proto $client_scheme {
        default $scheme;
        http    http;
        https   https;
    }

    # ------------------------------------------------------------------
    # HTTP (8080) — входная точка для ngrok.
    # Никаких редиректов: ngrok сам терминирует TLS и передаёт нам HTTP.
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        client_max_body_size 1m;

        # Часть security headers, которые не зависят от TLS-канала.
        # HSTS здесь ставить нельзя — он бы «прилип» к http:// домену ngrok.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            proxy_pass $app_upstream$request_uri;
            include /etc/nginx/proxy_params_inline.conf;
            # Переопределяем после include: для клиента мы фактически HTTPS
            # (ngrok его терминирует), поэтому сообщаем приложению https.
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass $app_upstream$request_uri;
            include /etc/nginx/proxy_params_inline.conf;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass $app_upstream$request_uri;
            include /etc/nginx/proxy_params_inline.conf;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS (8443) — как и раньше, для локальной работы.
    # ------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

        client_max_body_size 1m;

        location = /auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            proxy_pass $app_upstream$request_uri;
            include /etc/nginx/proxy_params_inline.conf;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass $app_upstream$request_uri;
            include /etc/nginx/proxy_params_inline.conf;
        }

        location / {
            proxy_pass $app_upstream$request_uri;
            include /etc/nginx/proxy_params_inline.conf;
        }
    }
}